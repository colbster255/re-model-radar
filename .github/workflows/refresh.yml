name: Hourly evidence refresh
on:
  push:
    branches: [main]
    paths: ["lib/adapters/**", "lib/top-ten.ts", ".github/workflows/refresh.yml"]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - name: Save material changes
        run: |
          git add data/radar.json data/rankings.json data/decisions.json data/top-ten.json
          if git diff --cached --quiet; then
            echo "No material changes. No deployment needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh technical model evidence"
          git push
      - name: Collector diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refresh-diagnostics
          path: data/refresh-status.json
          retention-days: 7
